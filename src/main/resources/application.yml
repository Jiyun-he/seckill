spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:seckill_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:seckill}
    password: ${RABBITMQ_PASS:seckill123}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-your-256-bit-secret}
  expiration: 86400000
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:0}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
seckill:
  consumer:
    # Keep the misspelled variable as a compatibility fallback for existing deployments.
    concurrency: ${SECKILL_CONSUMER_CONCURRENCY:${SEKKILL_CONSUMER_CONCURRENCY:2}}
server:
  port: ${APP_PORT:8080}

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.example.seckill.controller
